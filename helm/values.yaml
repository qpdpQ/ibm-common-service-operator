# Note there are no leading or trailing /'s
cpfs:
  imageRegistryNamespaceOperator: cpopen
  imageRegistryNamespaceOperand: cpopen/cpfs
  storageClass: nfs-storage
  labels:
  # CR configurations
  size: starterset
  # Red Hat OCP authentication configuration
  roksEnabled: true

# Commented out values are handled by a global values file
# imagePullPrefix: icr.io
# imagePullSecret: ibm-entitlement-key

# other configuration you think you might need for your operator
# following are examples, not required:
# operatorNamespace: ""
# servicesNamespace: ""

global:
  imagePullPrefix: icr.io
  tetheredNamespaces: []
  operatorNamespace: helm
  imagePullSecret: ibm-entitlement-key
  instanceNamespace: helm
